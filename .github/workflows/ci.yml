name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Build tests
        run: docker build -t prometheus_client_cxx_tests -f ./tests/Dockerfile .

      - name: Run tests
        run: |
          mkdir -p .coverage
          docker run --rm -v ${{ github.workspace }}/.coverage:/coverage prometheus_client_cxx_tests

      - name: Check if filtered coverage exists
        run: |
          ls -la .coverage/
          head -n 5 ${{ github.workspace }}/.coverage/coverage.filtered.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ${{ github.workspace }}/.coverage/coverage.filtered.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          disable_search: true
